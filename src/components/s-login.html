<section class="s-auth">
  <div class="container">
    <div class="sect-head">
      <div class="sect-head__info">
        <div class="breadcrumbs">
          <a href="#" class="breadcrumb-item">
            <i class="icon-prev"></i>
            <span>Вернуться назад</span>
          </a>
        </div>
      </div>
    </div>
    <a href="/" class="s-auth__logo">
      <img src="@img/logo.svg" alt="logo" />
    </a>
    <div class="s-auth__body">
      <h1 class="s-title s-auth__title">Авторизация</h1>
      <div class="s-auth__nav">
        <a href="#" data-tab-btn="tab-0" class="btn-m _outline">
          Физическое лицо
        </a>
        <a href="#" data-tab-btn="tab-1" class="btn-m _outline _active">
          Юридическое лицо
        </a>
      </div>
      <form action="#" class="s-auth__form">
        <div class="form-grid">
          <div class="form-control _full">
            <div class="input-name">Логин</div>
            <input required type="text" class="input" />
          </div>
          <div class="form-control _full">
            <div class="input-name">Пароль</div>
            <input required type="password" class="input" />
          </div>
        </div>
        <button type="submit" class="btn-s s-auth__form-submit">Войти</button>
      </form>
      <p class="s-auth__form-content">
        Нет аккаунта? <br>
        <a href="#">Зарагестрируйтесь</a> на сайте
      </p>
    </div>
  </div>
</section>
