<section class="sect-m s-connect">
  <div class="container">
    <div class="s-connect__body">
      <div class="s-connect__wrap">
        <h2 class="s-title s-connect__title">Сделайте заказ</h2>
        <div class="s-connect__content">
          <p>
            Отправьте заявку для оформления заказа, и мы свяжемся с вами
            в ближайшее время
          </p>
        </div>
        <form action="#" class="s-connect__form">
          <div class="form-wrap">
            <div class="form-control">
              <div class="input-name">Имя</div>
              <input required type="text" class="input _transparent" />
            </div>
            <div class="form-control">
              <div class="input-name">Номер телефона</div>
              <input required type="text" class="input _transparent" />
            </div>
            <button type="submit" class="btn-s s-connect__form-submit">
              Оставить заявку
            </button>
          </div>
          <label class="check-item">
            <input type="checkbox" />
            <span>
              <span>
                Я согласен с условиями
                <a href="#" target="_blank">Политики конфеденциальности</a>
                и подтверждаю свое согласие на обработку компанией «Колорит»
                предоставленных мной персональных данных.
              </span>
            </span>
          </label>
        </form>
      </div>
      <img src="@img/order.png" alt="image" class="s-connect__img">
    </div>
  </div>
</section>
